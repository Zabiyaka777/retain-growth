[build]
  command = "npm --prefix web install && npm --prefix web run build"
  publish = "web/dist"
  functions = "netlify/functions"

# VITE_ vars are inlined into the frontend bundle at build time. Only public
# values live here — the anon key and the VAPID *public* key are both meant
# to be shipped to the browser; the VAPID private key never appears in this
# file (it's in Vault, read server-side only — see send-push-notification.ts).
[build.environment]
  VITE_SUPABASE_URL = "https://jgtykwfwxotticfxvvwd.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpndHlrd2Z3eG90dGljZnh2dndkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjM3MTEsImV4cCI6MjEwMzIzOTcxMX0.ySl8qLRv632Go0q6BLTgZK43sycE9Tb8i-H2cI922Hw"
  VITE_VAPID_PUBLIC_KEY = "BHhyAGk1cF6CSBHj-_twj7JInJ1DuPZoSJ-F3NIMgK3WXl503IKrXJXqlfnqjB59Jeo9GVbuleABHihznuqMNyY"

[functions]
  node_bundler = "esbuild"

# Every minute: advances active funnel_states whose waiting_until is due
# (linear funnels.definition model).
[functions."funnel-processor"]
  schedule = "* * * * *"

# Same, for graph-based funnel_states (funnel_node_id set). Button-click
# advances happen via a direct call from telegram-webhook.ts instead of
# waiting for this — this schedule only covers entry/action/no-button-message
# nodes that don't need a callback_query to proceed.
[functions."funnel-processor-v2"]
  schedule = "* * * * *"

# Once a day (not urgent like the per-minute processors above): stops
# 'active' graph funnel_states whose waiting_until has been in the past for
# more than 21 days — abandoned button-wait states that would otherwise sit
# forever. Status-only change, never deletes anything.
[functions."funnel-auto-stop"]
  schedule = "0 3 * * *"

# Once a day: flips any org still 'trial' past its trial_ends_at over to
# 'free' and turns off whatever paid addons it had enabled.
[functions."billing-trial-expire"]
  schedule = "0 4 * * *"

# Public lead-gen short links -> redirect.ts (must stay above the SPA catch-all).
# For a redirect that targets a Function, Netlify invokes the function but
# leaves event.path/queryStringParameters as the browser's ORIGINAL request
# (placeholder/:splat substitution into "to" has no effect on what the
# function actually sees) — so redirect.ts parses the token straight off the
# original /r/:token path instead of relying on any substitution here.
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/redirect"
  status = 200

# ---------------------------------------------------------------------------
# Security headers.
# Netlify merges every [[headers]] rule that matches a path, and two
# Content-Security-Policy headers are BOTH enforced by the browser (the
# stricter wins). So the CSP is never in the catch-all "/*" rule: the app
# routes get the strict one, /lp/* its own looser one, and "/*" carries only
# the headers that are identical everywhere.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone: voice notes recorded in the funnel builder.
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"

# The app itself: only its own bundle may run. Everything it talks to is
# listed — Supabase (REST + realtime), openrouter.ai (public model list in the
# funnel builder), Google Fonts. Images/media are any https because
# attachments and landing images are user-supplied URLs; they can't execute.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://jgtykwfwxotticfxvvwd.supabase.co wss://jgtykwfwxotticfxvvwd.supabase.co https://openrouter.ai; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
  for = "/login"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://jgtykwfwxotticfxvvwd.supabase.co wss://jgtykwfwxotticfxvvwd.supabase.co https://openrouter.ai; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
  for = "/dashboard"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://jgtykwfwxotticfxvvwd.supabase.co wss://jgtykwfwxotticfxvvwd.supabase.co https://openrouter.ai; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://jgtykwfwxotticfxvvwd.supabase.co wss://jgtykwfwxotticfxvvwd.supabase.co https://openrouter.ai; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
  for = "/admin"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://jgtykwfwxotticfxvvwd.supabase.co wss://jgtykwfwxotticfxvvwd.supabase.co https://openrouter.ai; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://jgtykwfwxotticfxvvwd.supabase.co wss://jgtykwfwxotticfxvvwd.supabase.co https://openrouter.ai; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Public landing pages: same base, plus what the page legitimately injects —
# the Meta / TikTok / Google pixels an operator configures (their bootstrap
# snippets are inline, hence 'unsafe-inline' here and only here). The
# operator's custom code runs in a srcdoc iframe, which inherits this policy,
# so it too can only load scripts from these vendors. Still no framing of
# the page by anyone else.
# *.run.app / *.on.aws: Meta's pixel config script (connect.facebook.net/
# signals/config/<pixel>) posts to Meta endpoints hosted on Cloud Run and AWS
# (seen: mpc-prod-…us-central1.run.app/events, …ecs.us-east-1.on.aws/events),
# with host names that vary — hence the wildcards, on /lp only.
[[headers]]
  for = "/lp/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://analytics.tiktok.com https://*.tiktok.com https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://jgtykwfwxotticfxvvwd.supabase.co wss://jgtykwfwxotticfxvvwd.supabase.co https://*.facebook.com https://*.facebook.net https://*.tiktok.com https://*.tiktokw.us https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.doubleclick.net https://www.google.com https://*.run.app https://*.on.aws; frame-src https://*.facebook.com https://*.doubleclick.net https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# React Router client-side routes (e.g. /login, /dashboard) must fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm --prefix web run dev -- --port 5183 --strictPort"
  targetPort = 5183
  publish = "web/dist"
  functions = "netlify/functions"
  framework = "#custom"
